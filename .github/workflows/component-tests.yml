name: Component tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --check scripts/gen-spec-html.js
      - run: npx playwright install --with-deps chromium
      - run: npm test
