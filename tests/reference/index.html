<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova component comparison</title>
<style>
  body { margin: 1rem; font: 1rem system-ui; background: #eee; color: #161616; }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 1rem; }
  iframe { display: block; width: 100%; height: 26rem; border: 1px solid #ccc; box-sizing: border-box; }
  h1 { font-size: 1.25rem; }
  h2 { font-size: 1rem; }
</style>
<h1>Base UI / Nova component comparison</h1>
<p><a href="?theme=light">Light</a> · <a href="?theme=dark">Dark</a></p>
<main>
  <section><h2>Official React components</h2><iframe title="Official Nova" src="official.html"></iframe></section>
  <section><h2>shadcn-html components</h2><iframe title="HTML port" src="html.html"></iframe></section>
</main>
<script>
  if (new URLSearchParams(location.search).get('theme') === 'dark') {
    document.querySelectorAll('iframe').forEach(frame => frame.src += '?theme=dark');
  }
</script>
</html>
